name: Update Astro

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

concurrency:
  group: update-astro
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      # Anything pushed with GITHUB_TOKEN is attributed to github-actions[bot],
      # and workflow runs for a bot's own pull request land in `action_required`
      # waiting on a human. The required check never reports, so the auto-merge
      # enabled below never fires and the update sits open indefinitely. An app
      # installation token carries the app's identity instead, so CI runs
      # unattended. Configure the AUTOMATION_APP_ID variable and the
      # AUTOMATION_APP_PRIVATE_KEY secret to turn this on.
      - name: Mint an app installation token
        id: app
        if: vars.AUTOMATION_APP_ID != ''
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.AUTOMATION_APP_ID }}
          private-key: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}

      - name: Warn when the app is not configured
        if: vars.AUTOMATION_APP_ID == ''
        run: echo "::warning title=Automation app not configured::Falling back to GITHUB_TOKEN. The pull request will open, but its CI run waits for manual approval and auto-merge never fires. Set the AUTOMATION_APP_ID variable and the AUTOMATION_APP_PRIVATE_KEY secret."

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # Carried into the push below, so the commit lands as the app.
          token: ${{ steps.app.outputs.token || github.token }}

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - name: Use the latest npm
        run: npm install --global npm@latest

      - name: Update Astro and its integrations
        id: update
        run: node .github/scripts/update-astro.mjs

      - name: Verify the updated template
        if: steps.update.outputs.changed == 'true'
        run: |
          npm ci --engine-strict
          npm audit --audit-level=high
          npm run check
          npm run build

      - name: Push the update branch
        if: steps.update.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token || github.token }}
          SUMMARY: ${{ steps.update.outputs.summary }}
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
        run: |
          # Commit as whichever identity pushed, so the author matches the
          # account the commit is actually attributed to. The numeric id is what
          # links a noreply address to the account on github.com.
          AUTHOR="github-actions[bot]"
          if [ -n "$APP_SLUG" ]; then AUTHOR="$APP_SLUG[bot]"; fi
          ID=$(gh api "/users/$AUTHOR" --jq .id)
          git config user.name "$AUTHOR"
          git config user.email "$ID+$AUTHOR@users.noreply.github.com"
          git checkout -B automation/astro-latest
          git add package.json package-lock.json
          git commit -m "Update Astro dependencies" -m "$SUMMARY"
          git push --force origin HEAD:automation/astro-latest

      - name: Open or update the pull request
        if: steps.update.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token || github.token }}
          SUMMARY: ${{ steps.update.outputs.summary }}
          ASTRO_VERSION: ${{ steps.update.outputs.astro_version }}
          NODE_VERSION: ${{ steps.update.outputs.node_version }}
          REVIEW_REQUIRED: ${{ steps.update.outputs.review_required }}
        run: |
          PR=$(gh pr list --head automation/astro-latest --base main --state open --json number --jq '.[0].number')
          BODY=$(printf '%s\n\n%s\n%s' \
            "Keeps the Lumos template on the latest Astro toolchain." \
            "- $SUMMARY" \
            "- Template runtime synced from Astro: Node >=$NODE_VERSION")

          if [ -z "$PR" ]; then
            gh pr create \
              --base main \
              --head automation/astro-latest \
              --title "Update Astro to $ASTRO_VERSION" \
              --body "$BODY"
            PR=$(gh pr list --head automation/astro-latest --base main --state open --json number --jq '.[0].number')
          else
            gh pr edit "$PR" --title "Update Astro to $ASTRO_VERSION" --body "$BODY"
          fi

          if [ "$REVIEW_REQUIRED" = "false" ]; then
            gh pr merge "$PR" --auto --squash
          fi
