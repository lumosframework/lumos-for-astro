name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer commit makes an in-flight run redundant, so drop it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Type-check and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Read the supported Node version
        id: runtime
        run: |
          REQUIRED_NODE=$(jq -er '.engines.node | ltrimstr(">=")' package.json)
          echo "version=$REQUIRED_NODE" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v7
        with:
          # The oldest supported release, so newer syntax can't slip in unnoticed.
          node-version: ${{ steps.runtime.outputs.version }}
          cache: npm

      # The starter does not pin npm, so verify the lockfile with what a new
      # install receives today as well as the supported Node runtime.
      - name: Use the latest npm
        run: npm install --global npm@latest

      - run: npm ci --engine-strict

      - run: npm audit --audit-level=high

      - run: npm run check

      - run: npm run build
