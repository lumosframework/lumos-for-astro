name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer commit makes an in-flight run redundant, so drop it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Type-check and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # The oldest supported major, so newer syntax can't slip in unnoticed.
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run check

      - run: npm run build
